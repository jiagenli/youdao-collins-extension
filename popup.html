<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>柯林斯查词</title>
    <link rel="stylesheet" href="popup.css">
    <script type="module" src="popup.js"></script>
  </head>
  <body>
    <header>
      <h1>柯林斯查词</h1>
      <form id="search" novalidate>
        <label for="word">英文单词或短语</label>
        <div class="search-row">
          <input id="word" name="word" type="text" placeholder="例如 serendipity" maxlength="120" autocomplete="off" autocapitalize="off" spellcheck="false" autofocus>
          <button type="submit" class="primary">查词</button>
        </div>
      </form>
    </header>
    <main id="main" tabindex="-1">
      <p id="status" role="status" aria-live="polite">输入单词，按 Enter 查看释义。</p>
      <div id="result" aria-busy="false"></div>
    </main>
    <footer>
      <span>词典内容来自有道</span>
      <a id="source" target="_blank" rel="noopener noreferrer" hidden>打开原词典</a>
    </footer>
  </body>
</html>
